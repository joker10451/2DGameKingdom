# Конфигурация GameStudio для проекта «Хроники Олдерии» (Godot 4)
PROJECT_NAME="Хроники Олдерии: Живой Мир"
ENGINE="godot-4"

# Команды ворот и проверок
INSTALL_CMD="echo 'Godot project ready'"
GATES_CMD="godot --headless --path e:/kiro/game/godot --validate"
SHOTS_CMD="echo 'Screenshots taken via MCP runtime'"
HEADLESS_GAMES_CMD="godot --headless --path e:/kiro/game/godot --run scenes/game2d.tscn"

# Зоны ответственности исходников
ZONES=(
    "godot/src/core"
    "godot/src/character"
    "godot/src/game2d"
    "godot/src/world"
    "godot/src/items"
    "godot/scenes"
)

# Разрешение экрана и масштабирование
LOGICAL_BOX="1280x720"
SCALES=("1" "1.5" "2")
WORST_LOCALE="RU"

# Подсчет строк кода игры против приборов и документов
PROD_FIND="find godot/src -name '*.gd'"
STYLE_FIND="find godot/scenes -name '*.tscn'"
TEST_FIND="find tests -name '*.gd' 2>/dev/null || true"
DOC_FIND="find docs -name '*.md'"
