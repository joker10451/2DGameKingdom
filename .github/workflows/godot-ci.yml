name: Godot Engine CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Headless Validation & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for MCP server syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate MCP Server Script Syntax
        run: |
          node --check godot/.mcp/scripts/godot-mcp-server.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Git Cleanliness & No Junk Files
        run: |
          ! find . -name 'desktop.ini' -o -name 'Thumbs.db' -o -name '.DS_Store' | grep -q . || (echo 'ERROR: Junk OS files found in repo!' && exit 1)

      - name: Setup Godot Engine (Headless)
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import Godot Assets & Verify Project Syntax
        run: |
          cd godot
          godot --headless --editor --quit-after 50 || true
